schema: spec-driven

context: |
  Talking Bob — Telegram-тренажёр разговорного английского.
  Backend: TypeScript, NestJS, grammY, Prisma/PostgreSQL. Admin: Vue/Vite.
  Сообщения интерфейса и отчёты — на русском; учебные вопросы и follow-up — на английском.
  Перед планированием читай AGENTS.md, docs/sdd-workflow.md и docs/architecture/README.md,
  затем затронутые контракты, реализацию и ближайшие тесты.
  docs/app.md и docs/database.md остаются нормативными для ещё не перенесённых контрактов.
  Перенос одного поведения в openspec/specs выполняется вместе с заменой дубля ссылкой
  и обновлением карты источников истины; расхождения кода и контракта сначала согласуются.
  Prisma schema и SQL migrations задают структуру хранения и DB-инварианты;
  docs/operations.md описывает эксплуатацию.
  AI вызывается через WHISPER_SERVICE, LLM_SERVICE, TTS_SERVICE и их интерфейсы.
  Telegram handlers делегируют бизнес-логику сервисам. Сохраняй текущие границы модулей.
  Сохраняй публичные API, route contracts и данные вне согласованного изменения.
  Не добавляй библиотеки, изменения архитектуры или функции вне MVP без согласования.
  Пояснения пиши по-русски; синтаксис OpenSpec и идентификаторы сохраняй на английском.
  Публичные действия на GitHub требуют явного аппрува по AGENTS.md.
  Изменения подтверждённо приватных ресурсов в рамках задачи, включая движение карточек,
  можно выполнять без отдельного аппрува; проверяй видимость ресурса и публичные эффекты.

rules:
  proposal:
    - Укажи проблему, текущий контракт, границы результата, non-goals и затронутые области.
    - Сошлись на конкретные источники и отдели наблюдаемое поведение от предлагаемых изменений.
  specs:
    - Описывай проверяемое поведение, включая ошибки, повторы и ограничения, когда они применимы.
    - Сохраняй Requirement, Scenario, SHALL/MUST и WHEN/THEN; каждый requirement должен иметь сценарий.
    - Не придумывай продуктовые требования для tooling или правок без изменения поведения.
  design:
    - Обоснуй минимальное решение в текущей архитектуре и сохранение публичных контрактов.
    - При затрагивании данных или фоновой работы опиши миграции, конкуренцию и восстановление.
  tasks:
    - Свяжи сценарии с проверками; используй существующие команды package.json и ближайшие тесты.
    - Включи review, актуализацию затронутых контрактов и запись фактически выполненных проверок.
    - Отмечай задачу выполненной только при подтверждённом результате; пропущенная проверка не успешна.

operations:
  apply:
    guidance:
      - Выполняй только согласованный scope; материальные изменения плана сначала согласуй.
      - "Соблюдай правило GitHub из AGENTS.md: публичные действия требуют аппрува; приватные в рамках задачи — нет."
      - "Проверяй видимость затронутого ресурса: приватная доска не отменяет аппрув для изменения публичного issue."
  archive:
    guidance:
      - Перед архивированием проверь задачи, тесты, review и соответствие реализации требованиям.
      - Синхронизируй реализованные delta specs и проверь итоговые основные specs; сообщи о незавершённых проверках.
